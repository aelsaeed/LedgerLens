services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerlens:local
    init: true
    ports:
      - "${LEDGERLENS_PORT:-8000}:8000"
    environment:
      LEDGERLENS_OCR_LANG: "${LEDGERLENS_OCR_LANG:-eng}"
      LEDGERLENS_OCR_TIMEOUT_SECONDS: "${LEDGERLENS_OCR_TIMEOUT_SECONDS:-15}"
      LEDGERLENS_MAX_UPLOAD_BYTES: "${LEDGERLENS_MAX_UPLOAD_BYTES:-10485760}"
      LEDGERLENS_MAX_IMAGE_PIXELS: "${LEDGERLENS_MAX_IMAGE_PIXELS:-25000000}"
      LEDGERLENS_EXPOSE_RAW_TEXT: "${LEDGERLENS_EXPOSE_RAW_TEXT:-false}"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 10s
