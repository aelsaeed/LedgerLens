[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.2.0"
description = "Explainable invoice OCR, extraction, and arithmetic validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Ahmed Ibrahim"}]
keywords = ["invoice-processing", "ocr", "document-ai", "fastapi", "data-extraction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "pillow>=10.2,<13",
  "python-multipart>=0.0.9,<1",
  "pytesseract>=0.3.10,<1",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/aelsaeed/LedgerLens"
Repository = "https://github.com/aelsaeed/LedgerLens"
Issues = "https://github.com/aelsaeed/LedgerLens/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "pytest>=9.2.0,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
ledgerlens = "invoice_scanner.cli:app"
invoice-scanner = "invoice_scanner.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_scanner = ["py.typed", "static/*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=invoice_scanner --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["invoice_scanner"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
